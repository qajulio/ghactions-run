name: Corridas SP - via GitHubActions

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: corridas-sp

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Buscar corridas e gerar relatório
        run: node src/main.js

      - name: Criar Issue de alerta
        uses: actions/github-script@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let raceCount = 0;
            let preview = '';
            try {
              const md = fs.readFileSync('docs/index.md', 'utf-8');
              const lines = md.split('\n');
              const dataRows = lines.filter(l => l.startsWith('|') && !l.startsWith('| ---') && !l.startsWith('| Evento'));
              raceCount = dataRows.length;
              const eventLines = dataRows.slice(0, 5).map(l => l.replace(/\|/g, ' ').trim()).join('\n');
              preview = eventLines ? `\n\nPrimeiras corridas encontradas:\n\`\`\`\n${eventLines}\n\`\`\`` : '';
            } catch (e) {
              preview = '\n\n⚠️ Não foi possível ler o relatório gerado.';
            }
            const today = new Date().toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Relatório de Corridas — ${today}`,
              body: `Foram encontradas **${raceCount} corrida(s)** hoje em São Paulo-SP.${preview}\n\nO relatório completo está disponível no GitHub Pages.\n\n---\n🤖 Gerado automaticamente via GitHub Actions — Corridas SP`,
              labels: ['relatório', 'alerta']
            });

      - name: Deploy no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
