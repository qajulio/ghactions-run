name: Corridas SP - GitHubActions v260923

on:
  schedule:
    - cron: '0 08 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: corridas-sp

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Buscar corridas e gerar relatório
        run: node src/main.js

      - name: Criar Issue de alerta
        uses: actions/github-script@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let raceCount = 0;
            let reportContent = '';
            try {
              const md = fs.readFileSync('docs/index.md', 'utf-8');
              const lines = md.split('\n');
              const dataRows = lines.filter(l => l.startsWith('|') && !l.startsWith('| ---') && !l.startsWith('| Evento'));
              raceCount = dataRows.length;
              reportContent = md;
            } catch (e) {
              reportContent = '';
            }
            const spDate = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
            const day = String(spDate.getDate()).padStart(2, '0');
            const month = String(spDate.getMonth() + 1).padStart(2, '0');
            const year = spDate.getFullYear();
            const today = `${year}/${month}/${day}`;
            const reportSection = reportContent
              ? `\n\n---\n\n${reportContent}`
              : '\n\n⚠️ Não foi possível ler o relatório gerado.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 ${today} - Report Run`,
              body: `Corrida(s) **${raceCount} ** hoje.${reportSection}\n\nO relatório completo com formatação aprimorada está disponível no GitHub Pages.\n\n---\n🤖 Gerado automaticamente via GitHub Actions — Corridas SP`,
              assignees: ['qajulio'],
              labels: ['runreport']
            });

      - name: Deploy no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
